<title>Kick Off 2 Character Prompts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the city prompts page's transit-board header and cards; tabs for the steps, each city's characters and Meshy. */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --sunk: #f6f7f9;
  --ink: #161922;
  --muted: #586071;
  --line: #d9dde5;
  --brand: #2a55c4;
  --ok: #1f8a4c;
  --city: var(--brand);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #191c23; --sunk: #14161c; --ink: #e8eaf0; --muted: #9ba2b2; --line: #2a2f3a;
    --brand: #7d9cff; --ok: #4cc283; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #191c23; --sunk: #14161c; --ink: #e8eaf0; --muted: #9ba2b2; --line: #2a2f3a;
  --brand: #7d9cff; --ok: #4cc283; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 980px; margin: 0 auto; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.brandline { max-width: 980px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brandline h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; margin: 0; text-transform: uppercase; }
.brandline .sub { color: var(--muted); font-size: 13px; }
nav.tabs { max-width: 980px; margin: 10px auto 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a {
  flex: none; text-decoration: none; color: var(--muted); font-family: var(--font-display); font-weight: 600; font-size: 18px;
  letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 12px 9px; border-bottom: 4px solid transparent; display: flex; align-items: center; gap: 8px;
}
nav.tabs a .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--dot); }
nav.tabs a:focus-visible, button:focus-visible, label.made:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

main { padding-top: 22px; display: grid; gap: 18px; }
h2.city { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
h2.city small { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 10px; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
p { margin: 0; max-width: 68ch; }
.lede { color: var(--muted); }

.climate { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; }
.chip.plain { padding-left: 12px; }
.chip .sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.steps { display: grid; gap: 10px; counter-reset: step; padding: 0; margin: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { counter-increment: step; content: counter(step); font-family: var(--font-display); font-weight: 700; font-size: 18px;
  width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; }
.steps li > div { min-width: 0; padding-top: 3px; }

.route { display: grid; gap: 10px; margin-top: 10px; }
.route-head { display: grid; gap: 2px; border-left: 4px solid var(--city); padding: 2px 0 2px 12px; }
.route-head .trip { color: var(--muted); font-size: 13.5px; }

.shot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.shot.first { border-color: var(--city); box-shadow: 0 0 0 1px var(--city) inset; }
.shot-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.sid { font-family: var(--font-mono); font-weight: 500; font-size: 13px; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.badge { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--city); }
.shot-title { font-weight: 600; flex: 1 1 220px; min-width: 0; }
.actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
button.copy {
  font: 600 13px var(--font-body); color: #fff; background: var(--city); border: 0; border-radius: 7px; padding: 7px 14px; cursor: pointer; min-width: 96px;
}
button.copy:hover { filter: brightness(1.08); }
button.copy.done { background: var(--ok); }
label.made { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
label.made input { width: 16px; height: 16px; accent-color: var(--ok); }
.shot.is-made .shot-title { color: var(--muted); }
pre.prompt {
  margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  background: var(--sunk); color: var(--ink); max-height: 22em; overflow: auto;
}
details.more summary { cursor: pointer; padding: 9px 14px; font-size: 13px; color: var(--muted); }
.note { font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.toolbar { max-width: 980px; margin: 10px auto 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .label { font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sunk); }
.seg button { font: 600 13px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 6px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.toolnote { font-size: 13px; color: var(--muted); }
.plus { font-size: 11.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
table.cmp tr:last-child td { border-bottom: 0; }
table.cmp th { color: var(--muted); font-weight: 600; }
table.cmp td b { font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .brandline .sub, .toolnote { display: none; }
  h2.city { font-size: 36px; }
  h2.city small { display: block; margin: 6px 0 0; }
  .actions { width: 100%; justify-content: space-between; margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
.pathrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.pathrow code { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; word-break: break-all; min-width: 0; }
button.ghost { font: 600 12.5px var(--font-body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; margin-left: auto; }
button.ghost.done { color: var(--ok); border-color: var(--ok); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.card code, .steps code, td code { font-family: var(--font-mono); font-size: 12.5px; }
.checks li { list-style: none; position: relative; padding-left: 24px; }
.checks li::before { content: ""; position: absolute; left: 0; top: 4px; width: 14px; height: 14px; border: 2px solid var(--city); border-radius: 4px; }
.checks { padding-left: 0 !important; }
.stage { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--city); }
</style>
<header class="top">
  <div class="brandline">
    <h1>Kick Off 2 · Character prompts</h1>
    <span class="sub">Pictures in Gemini or ChatGPT, models in meshy.ai, one character at a time</span>
  </div>
  <div class="toolbar"><span class="label" id="tool-label">Prompts for</span><div class="seg" role="group" aria-labelledby="tool-label" id="toolseg"></div><span class="toolnote" id="toolnote"></span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<div class="wrap"><main id="view"></main></div>

<script>
const DATA = /*DATA*/null;
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
};

// The two tools: the same prompts, each with its own FORMAT paragraph (the build doc's).
const TOOLS = {
  gemini: { name: 'Gemini', note: 'Portrait 2:3, one view a picture; its sparkle mark stays clear of the child' },
  chatgpt: { name: 'ChatGPT', note: 'Portrait 2:3, one view a picture; it adds no mark' },
};
let tool = store.get('tool') === 'chatgpt' ? 'chatgpt' : 'gemini';   // Gemini first: the user's choice for characters

function renderToolbar() {
  document.getElementById('toolseg').replaceChildren(...Object.keys(TOOLS).map(t => el('button', {
    type: 'button', 'aria-pressed': String(t === tool),
    onclick: () => { tool = t; store.set('tool', t); renderToolbar(); route(); }
  }, TOOLS[t].name)));
  document.getElementById('toolnote').textContent = TOOLS[tool].note;
}

function copyButton(getText, preEl, label, cls) {
  const b = el('button', { class: cls || 'copy', type: 'button' }, label || 'Copy');
  b.addEventListener('click', () => {
    const done = ok => {
      b.textContent = ok ? 'Copied' : 'Selected: press copy';
      b.classList.toggle('done', ok);
      setTimeout(() => { b.textContent = label || 'Copy'; b.classList.remove('done'); }, 1600);
    };
    const select = () => {
      if (!preEl) return done(false);
      const r = document.createRange(); r.selectNodeContents(preEl);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); done(false);
    };
    try { navigator.clipboard.writeText(getText()).then(() => done(true), select); } catch (e) { select(); }
  });
  return b;
}

function promptCard(ch, v, city) {
  const key = 'made:' + ch.id + ':' + v.file;
  const text = v.tools[tool];
  const pre = el('pre', { class: 'prompt' }, text);
  const card = el('article', { class: 'shot' + (v.view === 'Front' ? ' first' : ''), id: 'shot-' + ch.id + '-' + v.file });
  const box = el('input', { type: 'checkbox', id: 'made-' + ch.id + '-' + v.file });
  box.checked = !!store.get(key);
  card.classList.toggle('is-made', box.checked);
  box.addEventListener('change', () => { store.set(key, box.checked ? '1' : ''); card.classList.toggle('is-made', box.checked); progress(city); });
  const path = el('code', null, v.path);
  card.append(
    el('div', { class: 'shot-head' },
      el('span', { class: 'sid' }, v.file.slice(0, 1)),
      el('span', { class: 'badge' }, TOOLS[tool].name),
      el('span', { class: 'shot-title' }, v.view + ' view', el('span', { class: 'lede' }, v.view === 'Front' ? ' · attach Mia’s four pictures' : ' · attach the front you just made')),
      el('div', { class: 'actions' }, el('label', { class: 'made', for: 'made-' + ch.id + '-' + v.file }, box, 'Pushed'), copyButton(() => text, pre))),
    pre,
    el('div', { class: 'pathrow' }, 'Push it as', path, copyButton(() => v.path, path, 'Copy path', 'ghost')));
  return card;
}

function progress(city) {
  const n = document.getElementById('progress');
  if (!n || !city) return;
  let all = 0, made = 0;
  city.characters.forEach(ch => ch.views.forEach(v => { all++; if (store.get('made:' + ch.id + ':' + v.file)) made++; }));
  n.textContent = made + ' of ' + all + ' pictures pushed';
}

const SECTIONS = () => [{ key: 'start', name: 'Start', accent: 'var(--brand)' }]
  .concat(DATA.cities.map(c => ({ key: c.key, name: c.name, accent: c.accent, city: c })))
  .concat([{ key: 'meshy', name: 'meshy.ai', accent: 'var(--brand)' }]);

function renderTabs(current) {
  tabs.replaceChildren(...SECTIONS().map(s => {
    const a = el('a', { href: '#' + s.key, style: '--dot:' + s.accent }, el('span', { class: 'dot' }), s.name);
    if (s.key === current) a.setAttribute('aria-current', 'page');
    return a;
  }));
}

function renderStart() {
  const first = DATA.cities[0], name = TOOLS[tool].name;
  view.replaceChildren(
    el('h2', { class: 'city' }, 'Characters', el('small', null, 'the people a level needs that the game doesn’t have')),
    el('p', { class: 'lede' }, 'Each character is four pictures you make in ' + name + ', then a rigged model you make from them in meshy.ai. The look is Mia’s: a realistic, detailed illustration of a real child, one view a picture, as hers were.'),
    el('ol', { class: 'steps' },
      el('li', null, el('div', null, el('b', null, 'One ' + name + ' chat for each child, the front first. '), 'Copy the front prompt from the city’s tab and attach the four pictures of Mia (front, back and both sides): they set the drawing style and realism, never the face.')),
      el('li', null, el('div', null, el('b', null, 'Then the back and the two sides, '), 'one message each, each with the front you just made attached so it stays the same child.')),
      el('li', null, el('div', null, el('b', null, 'Check the four before you push '), 'with the list on the city’s tab. If one view comes out a different child, make that view again.')),
      el('li', null, el('div', null, el('b', null, 'Push them where the cards say. '))),
      el('li', null, el('div', null, el('b', null, 'Make the model in meshy.ai '), 'from the four pictures, with the settings on the meshy.ai tab, and push the FBX beside them.')),
      el('li', null, el('div', null, el('b', null, 'I bring it into the game and review it: '), 'eight views, the walk animated, the face checked as the head turns. It goes into a level once you approve it.'))),
    el('div', { class: 'card' },
      el('h3', null, 'Why new characters'),
      el('p', null, 'For ' + first.who + ', the game’s own kids can’t be used:'),
      el('ul', null, ...first.reasons.map(r => el('li', { html: r })))),
    el('p', { class: 'note' }, 'The prompts and settings here come from each city’s build doc (Kamakura: docs/KAMAKURA_BUILD.md, “Characters (KM-C)”), so this page and the doc always agree.'));
}

function renderCity(city) {
  view.replaceChildren(
    el('h2', { class: 'city' }, city.name, el('small', null, city.country + ' · ' + city.who)),
    el('p', { class: 'progress', id: 'progress' }),
    el('p', { class: 'lede' }, 'Passers-by, not playable kids: they walk the pavement like the jogger and Grandad, and the game recolours their clothes and bags so a line of five looks like five children.'),
    ...city.characters.map(ch => el('section', { class: 'route' },
      el('div', { class: 'route-head' }, el('h3', null, ch.id + ' · ' + ch.title), el('span', { class: 'trip' }, 'One chat: the front first, then the back and both sides')),
      ...ch.views.map(v => promptCard(ch, v, city)))),
    el('div', { class: 'card' },
      el('h3', null, 'Before you push'),
      el('ul', { class: 'checks' },
        el('li', null, 'The same child in all four: face, hair, cap, randoseru and clothes alike.'),
        el('li', null, 'Realistic like Mia’s pictures, not anime or cartoon; the face Japanese, not Mia’s.'),
        el('li', null, 'True front, back and side views of the whole child, cap to shoes.'),
        el('li', null, 'An A-pose in every view: both arms straight and out at about 45 degrees, well clear of the body, not hanging at the sides as in Mia’s pictures.'),
        el('li', null, 'No logos or writing anywhere.'),
        tool === 'gemini' ? el('li', null, 'Gemini’s sparkle mark in the corner, clear of the child.') : null)),
    city.notes[tool] ? el('p', { class: 'note', html: city.notes[tool] }) : null);
  progress(city);
}

function renderMeshy() {
  const t = DATA.cities[0].table;
  view.replaceChildren(
    el('h2', { class: 'city' }, 'meshy.ai', el('small', null, 'from the four views to a rigged FBX')),
    el('p', { class: 'lede' }, 'The same steps for every character. Only the remesh count differs, between a passer-by and a playable kid.'),
    el('ol', { class: 'steps' }, ...DATA.cities[0].meshy.map(s => el('li', null, el('div', { html: s })))),
    el('div', { class: 'tablewrap' }, el('table', { class: 'cmp' },
      el('thead', null, el('tr', null, el('th', null, ''), el('th', null, 'Remesh in Meshy (Quad)'), el('th', null, 'About'), el('th', null, 'In the game'))),
      el('tbody', null,
        el('tr', null, el('td', null, el('b', null, 'Passer-by'), ' (' + t.passer.who + ')'), el('td', null, el('b', null, t.passer.quads + ' quads')), el('td', null, t.passer.tris + ' triangles'), el('td', null, t.passer.game + ' triangles')),
        el('tr', null, el('td', null, el('b', null, 'Playable kid')), el('td', null, el('b', null, t.kid.quads + ' quads')), el('td', null, t.kid.tris + ' triangles'), el('td', null, t.kid.game + ' triangles'))))),
    el('p', { class: 'note', html: DATA.cities[0].after }));
}

function route() {
  renderToolbar();
  const key = (location.hash || '#start').slice(1);
  const s = SECTIONS().find(x => x.key === key) || SECTIONS()[0];
  document.documentElement.style.setProperty('--city', s.accent);
  renderTabs(s.key);
  if (s.city) renderCity(s.city); else if (s.key === 'meshy') renderMeshy(); else renderStart();
  try { store.set('tab', s.key); } catch (e) {}
}
window.addEventListener('hashchange', route);
if (!location.hash) { const t = store.get('tab'); if (t && t !== 'start') location.hash = '#' + t; }
route();
</script>
