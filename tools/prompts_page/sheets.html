<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the city prompts page's transit-board header and cards; tabs for the start, the base prompts and each group. */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --sunk: #f6f7f9;
  --ink: #161922;
  --muted: #586071;
  --line: #d9dde5;
  --brand: #2a55c4;
  --ok: #1f8a4c;
  --city: var(--brand);
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #191c23; --sunk: #14161c; --ink: #e8eaf0; --muted: #9ba2b2; --line: #2a2f3a;
    --brand: #7d9cff; --ok: #4cc283; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #191c23; --sunk: #14161c; --ink: #e8eaf0; --muted: #9ba2b2; --line: #2a2f3a;
  --brand: #7d9cff; --ok: #4cc283; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 980px; margin: 0 auto; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.brandline { max-width: 980px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brandline h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: 0.02em; margin: 0; text-transform: uppercase; }
.brandline .sub { color: var(--muted); font-size: 13px; }
nav.tabs { max-width: 980px; margin: 10px auto 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a {
  flex: none; text-decoration: none; color: var(--muted); font-family: var(--font-display); font-weight: 600; font-size: 18px;
  letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 12px 9px; border-bottom: 4px solid transparent; display: flex; align-items: center; gap: 8px;
}
nav.tabs a .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dot); }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--dot); }
nav.tabs a:focus-visible, button:focus-visible, label.made:focus-within { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

main { padding-top: 22px; display: grid; gap: 18px; }
h2.city { font-family: var(--font-display); font-weight: 700; font-size: 44px; line-height: 1; margin: 6px 0 0; text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
h2.city small { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 10px; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
p { margin: 0; max-width: 68ch; }
.lede { color: var(--muted); }

.climate { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px; }
.chip.plain { padding-left: 12px; }
.chip .sw { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); }
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.steps { display: grid; gap: 10px; counter-reset: step; padding: 0; margin: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { counter-increment: step; content: counter(step); font-family: var(--font-display); font-weight: 700; font-size: 18px;
  width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; }
.steps li > div { min-width: 0; padding-top: 3px; }

.route { display: grid; gap: 10px; margin-top: 10px; }
.route-head { display: grid; gap: 2px; border-left: 4px solid var(--city); padding: 2px 0 2px 12px; }
.route-head .trip { color: var(--muted); font-size: 13.5px; }

.shot { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.shot.first { border-color: var(--city); box-shadow: 0 0 0 1px var(--city) inset; }
.shot-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.sid { font-family: var(--font-mono); font-weight: 500; font-size: 13px; background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.badge { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--city); }
.shot-title { font-weight: 600; flex: 1 1 220px; min-width: 0; }
.actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
button.copy {
  font: 600 13px var(--font-body); color: #fff; background: var(--city); border: 0; border-radius: 7px; padding: 7px 14px; cursor: pointer; min-width: 96px;
}
button.copy:hover { filter: brightness(1.08); }
button.copy.done { background: var(--ok); }
label.made { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
label.made input { width: 16px; height: 16px; accent-color: var(--ok); }
.shot.is-made .shot-title { color: var(--muted); }
pre.prompt {
  margin: 0; padding: 12px 14px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  background: var(--sunk); color: var(--ink); max-height: 22em; overflow: auto;
}
details.more summary { cursor: pointer; padding: 9px 14px; font-size: 13px; color: var(--muted); }
.note { font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.toolbar { max-width: 980px; margin: 10px auto 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .label { font-size: 13px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sunk); }
.seg button { font: 600 13px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 6px 16px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.toolnote { font-size: 13px; color: var(--muted); }
.plus { font-size: 11.5px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.cmp { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.cmp th, table.cmp td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
table.cmp tr:last-child td { border-bottom: 0; }
table.cmp th { color: var(--muted); font-weight: 600; }
table.cmp td b { font-variant-numeric: tabular-nums; }
@media (max-width: 520px) {
  .brandline .sub, .toolnote { display: none; }
  h2.city { font-size: 36px; }
  h2.city small { display: block; margin: 6px 0 0; }
  .actions { width: 100%; justify-content: space-between; margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
.pathrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.pathrow code { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; word-break: break-all; min-width: 0; }
button.ghost { font: 600 12.5px var(--font-body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; margin-left: auto; }
button.ghost.done { color: var(--ok); border-color: var(--ok); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; }
.card ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.card code, .steps code, td code { font-family: var(--font-mono); font-size: 12.5px; }
.checks li { list-style: none; position: relative; padding-left: 24px; }
.checks li::before { content: ""; position: absolute; left: 0; top: 4px; width: 14px; height: 14px; border: 2px solid var(--city); border-radius: 4px; }
.checks { padding-left: 0 !important; }
.stage { display: inline-block; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--city); }
</style>
<style>
.status { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); background: var(--sunk); white-space: nowrap; }
.status.in { color: var(--ok); border-color: var(--ok); }
.status.part { color: var(--city); border-color: var(--city); }
.basechip { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.aside { color: var(--muted); font-weight: 400; }
.files { font-family: var(--font-mono); font-size: 12px; color: var(--muted); word-break: break-word; }
.groupnote { display: grid; gap: 8px; }
.shot.base { border-color: var(--city); box-shadow: 0 0 0 1px var(--city) inset; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
/* each card's steps: the base, this prompt and its pictures, then each picture as it comes and its file */
ol.do { margin: 0; padding: 12px 14px 12px 36px; border-top: 1px solid var(--line); display: grid; gap: 12px; font-size: 13.5px; line-height: 1.45; }
ol.do > li::marker { color: var(--city); font-weight: 700; }
@media (max-width: 520px) { .basechip { display: none; } ol.do { padding-left: 30px; } }
ol.do code { font-family: var(--font-mono); font-size: 12px; background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; word-break: break-all; }
.att { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
.att figure { display: flex; gap: 9px; align-items: center; margin: 0; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 4px 4px; background: var(--sunk); min-width: 0; max-width: 100%; }
.att img { width: 72px; height: 48px; object-fit: cover; border-radius: 5px; flex: none; background: var(--line); }
.att figcaption { display: grid; gap: 1px; min-width: 0; }
.att figcaption b { font-family: var(--font-mono); font-size: 12.5px; }
.att figcaption span { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); word-break: break-all; }
.outs { list-style: none; padding: 0; margin: 7px 0 0; display: grid; gap: 6px; }
.outs li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.outs .msg { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--city); border-radius: 6px; padding: 2px 8px; }
.outs .to { color: var(--muted); white-space: nowrap; }
button.mini { font: 600 12px var(--font-body); color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button.mini.done { color: var(--ok); border-color: var(--ok); }
.do .hint { color: var(--muted); }
</style>
<header class="top">
  <div class="brandline">
    <h1>/*TITLE*/</h1>
    <span class="sub" id="sub"></span>
  </div>
  <div class="toolbar"><span class="label" id="tool-label">Prompts for</span><div class="seg" role="group" aria-labelledby="tool-label" id="toolseg"></div><span class="toolnote" id="toolnote"></span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<div class="wrap"><main id="view"></main></div>

<script>
const DATA = /*DATA*/null;
document.documentElement.style.setProperty('--city', DATA.accent);
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
};

// The two tools: the same prompts; ChatGPT's FORMAT paragraphs use its frame shapes.
const TOOLS = {
  gemini: { name: 'Gemini', note: 'Nano Banana Pro: the largest pictures, every frame shape asked for' },
  chatgpt: { name: 'ChatGPT', note: 'Frames of 1:1, 2:3 and 3:2 only: the prompts below say so' },
};
let tool = store.get('tool') === 'chatgpt' ? 'chatgpt' : 'gemini';

function renderToolbar() {
  document.getElementById('toolseg').replaceChildren(...Object.keys(TOOLS).map(t => el('button', {
    type: 'button', 'aria-pressed': String(t === tool),
    onclick: () => { tool = t; store.set('tool', t); renderToolbar(); route(); }
  }, TOOLS[t].name)));
  document.getElementById('toolnote').textContent = TOOLS[tool].note;
}

function copyButton(getText, preEl, label, cls) {
  const b = el('button', { class: cls || 'copy', type: 'button' }, label || 'Copy');
  b.addEventListener('click', () => {
    const done = ok => {
      b.textContent = ok ? 'Copied' : preEl ? 'Selected: press copy' : 'Could not copy';
      b.classList.toggle('done', ok);
      setTimeout(() => { b.textContent = label || 'Copy'; b.classList.remove('done'); }, 1600);
    };
    const select = () => {
      if (!preEl) return done(false);
      const r = document.createRange(); r.selectNodeContents(preEl);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); done(false);
    };
    try { navigator.clipboard.writeText(getText()).then(() => done(true), select); } catch (e) { select(); }
  });
  return b;
}

const madeKey = it => 'made:' + DATA.source + ':' + it.id + ':' + it.title;
function isIn(it) { return it.status && it.status.of > 0 && it.status.have >= it.status.of; }

function card(it, isBase) {
  const text = it.tools[tool];
  const pre = el('pre', { class: 'prompt' }, text);
  const c = el('article', { class: 'shot' + (isBase ? ' base' : ''), id: 'p-' + it.id + '-' + it.title.replace(/\W+/g, '-') });
  const head = el('div', { class: 'shot-head' },
    el('span', { class: 'sid' }, it.id),
    el('span', { class: 'badge' }, it.badge),
    el('span', { class: 'shot-title' }, it.title, it.aside ? el('span', { class: 'aside' }, ' (' + it.aside + ')') : null));
  const actions = el('div', { class: 'actions' });
  if (it.base) actions.append(el('span', { class: 'basechip' }, 'after BASE ' + it.base));
  if (!isBase && it.status) {
    const st = it.status;
    actions.append(el('span', { class: 'status ' + (isIn(it) ? 'in' : st.have ? 'part' : '') },
      isIn(it) ? 'In the repository' : st.have ? st.have + ' of ' + st.of + ' in' : 'To make'));
  }
  if (!isBase) {
    const box = el('input', { type: 'checkbox' });
    box.checked = !!store.get(madeKey(it)) || isIn(it);
    c.classList.toggle('is-made', box.checked);
    box.addEventListener('change', () => { store.set(madeKey(it), box.checked ? '1' : ''); c.classList.toggle('is-made', box.checked); progress(); });
    actions.append(el('label', { class: 'made' }, box, 'Made'));
  }
  actions.append(copyButton(() => it.tools[tool], pre));
  head.append(actions);
  c.append(head, isBase ? baseSteps(it) : steps(it), pre);
  return c;
}

// The pictures to attach: each one small, with its name and where it is in the repository.
function pictures(list) {
  return el('div', { class: 'att' }, ...list.map(a => el('figure', null,
    el('img', { src: DATA.thumbs[a.path], alt: a.id, loading: 'lazy' }),
    el('figcaption', null, el('b', null, a.id + (a.path.includes('/photo/') ? ' (photographic version)' : '')), el('span', null, a.path)))));
}
const baseOf = id => DATA.bases.find(b => b.id === id);
const viewWord = o => o.view ? 'the ' + o.view : 'the picture';

// A prompt's steps: its base first (and in which chat), this prompt with the pictures it names, then each picture.
function steps(it) {
  const ol = el('ol', { class: 'do' });
  const b = baseOf(it.base);
  if (b) {
    const copyBase = copyButton(() => b.tools[tool], null, 'Copy BASE ' + b.id, 'mini');
    ol.append(it.chat === 'new'
      ? el('li', null, el('b', null, 'New chat, just for this one. '),
          'Paste BASE ' + b.id + ' first, with this attached: ', copyBase, pictures(it.base_attach))
      : el('li', null, el('b', null, 'In your BASE ' + b.id + ' chat. '),
          'Starting it? Paste BASE ' + b.id + ' first, with this attached: ', copyBase, pictures(it.base_attach),
          el('div', { class: 'hint' }, 'Already pasted in this chat? Go straight to step 2.')));
  } else {
    ol.append(el('li', null, el('b', null, 'New chat. '), 'This prompt stands alone: no base prompt before it.'));
  }
  ol.append(it.attach.length
    ? el('li', null, el('b', null, 'Paste the prompt below '), '(Copy, above it) with ' + (it.attach.length === 1 ? 'this' : 'these ' + it.attach.length) + ' attached:', pictures(it.attach))
    : el('li', null, el('b', null, 'Paste the prompt below '), '(Copy, above it), with nothing attached.'));
  if (it.folder) {
    const path = el('code', null, it.folder);
    const outs = el('ul', { class: 'outs' }, ...it.outputs.map((o, i) => {
      const msg = o.send ? el('span', { class: 'msg' }, o.send) : el('span', null, i > 0 ? viewWord(o) : o.view ? 'Its reply, ' + viewWord(o) : 'Its reply');
      return el('li', null, o.send ? copyButton(() => o.send, msg, 'Copy', 'mini') : null, msg,
        el('span', { class: 'to' }, '\u2192 ', el('code', null, o.file)));
    }));
    ol.append(el('li', null, el('b', null, it.outputs.length > 1 ? 'Save each picture as it comes, ' : 'Save the picture, '), 'checking it first (the list on Start), in ', path, ' ',
      copyButton(() => it.folder, path, 'Copy path', 'mini'),
      it.outputs.length > 1 ? el('div', { class: 'hint' }, 'Send each message on its own, after the picture before it is saved.') : null, outs));
  }
  return ol;
}

// A base's steps: where it goes, what to attach, and what follows it.
function baseSteps(b) {
  const users = DATA.groups.flatMap(g => g.items).filter(it => it.base === b.id);
  const perItem = users.some(it => it.chat === 'new');
  return el('ol', { class: 'do' },
    el('li', null, el('b', null, 'New chat. '), 'Paste this with KM-0 attached:', pictures(b.attach)),
    el('li', null, el('b', null, 'Then '), perItem
      ? 'one of its ' + users.length + ' prompts. Each gets a chat of its own, starting with this base, so its views match.'
      : 'its ' + users.length + ' prompts, one per message, in this same chat. Each card says what to attach.'),
    b.views && b.views.length ? el('li', null, el('b', null, 'Its views, in this order: '), b.views.join(', ') + '. The first comes with the reply; ask for each next one with \u201cNext: ' + b.views[1] + '.\u201d and so on.') : null);
}

function counts() {
  let all = 0, made = 0, inRepo = 0;
  DATA.groups.forEach(g => g.items.forEach(it => { all++; if (isIn(it)) inRepo++; if (isIn(it) || store.get(madeKey(it))) made++; }));
  return { all, made, inRepo };
}
function progress() {
  const n = document.getElementById('progress');
  if (!n) return;
  const c = counts();
  n.textContent = c.made + ' of ' + c.all + ' made (' + c.inRepo + ' already in the repository)';
}

const SECTIONS = () => [{ key: 'start', name: 'Start' }, { key: 'bases', name: 'Base prompts' }]
  .concat(DATA.groups.map((g, i) => ({ key: 'g' + (i + 1), name: g.name, group: g })));

function renderTabs(current) {
  tabs.replaceChildren(...SECTIONS().map(s => {
    const a = el('a', { href: '#' + s.key, style: '--dot:' + (s.group ? 'var(--city)' : 'var(--brand)') }, el('span', { class: 'dot' }), s.name);
    if (s.key === current) a.setAttribute('aria-current', 'page');
    return a;
  }));
}

function renderStart() {
  view.replaceChildren(
    el('h2', { class: 'city' }, 'Start here'),
    ...DATA.intro.map(p => el('p', { class: 'lede', html: p })),
    el('p', { class: 'progress', id: 'progress' }),
    el('ol', { class: 'steps' }, ...DATA.how.map(h => el('li', null, el('div', { html: h })))),
    ...(DATA.how_note || []).map(p => el('p', { class: 'lede', html: p })),
    el('div', { class: 'card' },
      el('h3', null, 'Check each picture before saving it'),
      el('ul', { class: 'checks' }, ...DATA.checks.map(c => el('li', { html: c })))),
    el('p', { class: 'note' }, 'This page is made from ' + DATA.source + ', so it and the document always agree. Whether a prompt\u2019s pictures are in is read from its folder in the repository when the page is made; tick \u201cMade\u201d as you go, and this browser remembers.'));
  progress();
}

function renderBases() {
  const kids = [el('h2', { class: 'city' }, 'Base prompts', el('small', null, 'paste one first in a new chat, with KM-0 attached'))];
  DATA.bases.forEach(b => {
    kids.push(el('div', { class: 'route-head' }, el('h3', null, b.group), ...b.note.map(p => el('p', { class: 'trip', html: p }))));
    kids.push(card(b, true));
  });
  view.replaceChildren(...kids);
}

function renderGroup(g) {
  const kids = [el('h2', { class: 'city' }, g.name)];
  if (g.note.length) kids.push(el('div', { class: 'groupnote' }, ...g.note.map(p => el('p', { class: 'lede', html: p }))));
  g.items.forEach(it => kids.push(card(it, false)));
  view.replaceChildren(...kids);
}

function route() {
  const key = (location.hash || '#start').slice(1);
  const s = SECTIONS().find(x => x.key === key) || SECTIONS()[0];
  renderTabs(s.key);
  if (s.key === 'start') renderStart();
  else if (s.key === 'bases') renderBases();
  else renderGroup(s.group);
}
document.getElementById('sub').textContent = DATA.groups.reduce((n, g) => n + g.items.length, 0) + ' prompts in ' + DATA.groups.length + ' groups, from ' + DATA.source;
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
renderToolbar();
route();
</script>
